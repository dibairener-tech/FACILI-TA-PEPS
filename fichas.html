<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0a12"><title>Ficha do Peptídeo | FACILI-TA PEPS</title><style>
:root{color-scheme:dark;--bg:#0b0a12;--line:#302941;--text:#f5f1ff;--muted:#a79eb9;--violet:#b59aff;--cyan:#78e1d5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -15%,#30214b 0,transparent 45%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.65}.wrap{width:min(1000px,calc(100% - 38px));margin:auto}a{color:var(--cyan);text-decoration:none}.top{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:850;letter-spacing:.13em;color:var(--text)}.brand span{color:var(--violet)}.back{font-size:12px}.layout{padding:44px 0 80px}.crumb{font-size:10px;letter-spacing:.18em;color:var(--cyan);font-weight:800}.head{padding:22px 0 28px;border-bottom:1px solid var(--line);margin-bottom:25px}.head h1{font-size:clamp(36px,6vw,58px);letter-spacing:-.05em;line-height:1.06;margin:9px 0 8px}.aliases{font-size:12px;color:var(--muted)}.category{display:inline-block;border:1px solid #56456f;border-radius:30px;padding:6px 11px;color:#d6c7ff;font-size:10px;letter-spacing:.1em;margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{background:linear-gradient(145deg,#1b1828,#13111d);border:1px solid var(--line);border-radius:15px;padding:21px}.panel h2{font-size:12px;color:var(--violet);letter-spacing:.13em;text-transform:uppercase;margin:0 0 10px}.panel p{font-size:14px;color:#d1cadc;margin:0}.panel.wide{grid-column:1/-1}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.pill{font-size:10px;color:#bcb3cc;background:#1c1928;border:1px solid #383149;border-radius:20px;padding:6px 10px}.related{margin-top:24px;border-top:1px solid var(--line);padding-top:20px}.related h2{font-size:12px;letter-spacing:.15em;color:var(--muted)}.related-list{display:flex;gap:8px;flex-wrap:wrap}.related-list a{border:1px solid var(--line);border-radius:25px;padding:7px 12px;font-size:11px;color:#d4c8ed}.switch{display:flex;justify-content:space-between;gap:10px;margin-top:30px}.switch a{border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px}.notfound{text-align:center;padding:90px 0}.notfound h1{font-size:30px}.notfound p{color:var(--muted)}footer{border-top:1px solid var(--line);padding:24px 0 30px;color:#817990;font-size:10px;letter-spacing:.08em}footer strong{color:#e1d7ff;font-size:13px;letter-spacing:.14em}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel.wide{grid-column:auto}.top{height:68px}.layout{padding-top:30px}.panel{padding:18px}.switch{flex-direction:column}}</style></head><body><header class="wrap top"><a class="brand" href="index.html">FACILI-TA <span>PEPS</span></a><a class="back" href="index.html">← Voltar ao catálogo</a></header><main class="wrap layout" id="content"></main><footer class="wrap">FACILI-TA PEPS · DESENVOLVIDO POR <strong>RENER DIBAI</strong></footer><script src="peptides.js"></script><script>
const items=window.PEPTIDES||[],params=new URLSearchParams(location.search),wanted=params.get('peptide')||decodeURIComponent(location.hash.slice(1)),norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'');const item=items.find(p=>norm(p[0])===norm(wanted)||p[1].split('|').some(a=>norm(a)===norm(wanted)));const root=document.getElementById('content');
if(!item){root.innerHTML='<section class="notfound"><div class="crumb">FACILI-TA PEPS</div><h1>Peptídeo não encontrado</h1><p>Volte ao catálogo e selecione um composto da lista.</p><a href="index.html">← Abrir catálogo</a></section>'}else{document.title=item[0]+' | FACILI-TA PEPS';const group=item[2],related=items.filter(p=>p!==item&&p[2]===group).slice(0,8);root.innerHTML='<div class="crumb">CATÁLOGO / FICHA DO COMPOSTO</div><section class="head"><div class="crumb">'+group.toUpperCase()+'</div><h1 id="name"></h1><div class="aliases" id="aliases"></div><span class="category">'+group.toUpperCase()+'</span></section><section class="grid"><article class="panel wide"><h2>Visão geral</h2><p id="summary"></p></article><article class="panel"><h2>Contexto e objetivos de interesse</h2><p id="interest"></p></article><article class="panel wide"><h2>Sugestões de uso e aplicações conhecidas</h2><p id="usage"></p></article><article class="panel"><h2>Classificação</h2><p id="class"></p></article><article class="panel wide"><h2>Leitura prática</h2><p>É importante distinguir finalidade médica estabelecida, quando existe, objetivos investigados em estudos e aquilo que é divulgado por comunidades ou vendedores. Essas categorias não são equivalentes. Disponibilidade e status regulatório variam entre países.</p></article></section><div class="meta"><span class="pill">Ficha individual</span><span class="pill">Nome e aliases indexados</span><span class="pill">'+group+'</span></div><section class="related" id="related"></section><nav class="switch"><a href="index.html">← Voltar à pesquisa</a><a href="#" id="next">Próximo composto →</a></nav>';document.getElementById('name').textContent=item[0];document.getElementById('aliases').textContent='Também conhecido como: '+item[1].split('|').join(' · ');document.getElementById('summary').textContent=item[3];document.getElementById('interest').textContent=item[4];document.getElementById('usage').textContent=(window.PEPTIDE_USE||{})[item[0]]||'Aplicações e contextos de interesse ainda não cadastrados para este composto.';document.getElementById('class').textContent=item[3];document.getElementById('use-context').textContent='Área de interesse: '+group+'. '+item[4];const rel=document.getElementById('related');if(related.length){rel.innerHTML='<h2>OUTROS COMPOSTOS DA CATEGORIA</h2><div class="related-list"></div>';related.forEach(p=>{const a=document.createElement('a');a.href='fichas.html?peptide='+encodeURIComponent(norm(p[0]));a.textContent=p[0];rel.querySelector('.related-list').append(a)})}else rel.remove();const next=items[(items.indexOf(item)+1)%items.length];document.getElementById('next').href='fichas.html?peptide='+encodeURIComponent(norm(next[0]));}
</script></body></html>
